<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="skBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="skAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="skBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8" />
    </linearGradient>
    <filter id="skGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#skBgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#skBorderGrad)" stroke-width="8" />

  <!-- Subtle Inner Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#skAccentGrad)" stroke-width="2" opacity="0.15" />

  <!-- Monogram "SK" -->
  <g filter="url(#skGlow)">
    <text x="256" y="325"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="210"
          font-weight="900"
          letter-spacing="-10"
          text-anchor="middle"
          fill="url(#skAccentGrad)">
      SK
    </text>
  </g>

  <!-- Accent Status Dot (Cyan Glow) -->
  <circle cx="390" cy="130" r="18" fill="#00f0ff" />
  <circle cx="390" cy="130" r="30" fill="none" stroke="#00f0ff" stroke-width="3" opacity="0.4" />
</svg>
